services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pet_adoption
      MYSQL_USER: pet_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - database-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DB_URL: jdbc:mysql://database:3306/pet_adoption?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      DB_USER: pet_app
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_ID: ${ADMIN_ID:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes: ["upload-data:/var/lib/pet-adoption/uploads"]
    depends_on:
      database:
        condition: service_healthy
volumes:
  database-data:
  upload-data:
